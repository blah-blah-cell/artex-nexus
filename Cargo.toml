[workspace]
resolver = "2"
members = [
    "crates/nexus-common",
    "crates/nexus-sync",
    "crates/cve-intel-mcp",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/blah-blah-cell/artex-nexus"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
rayon = "1.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tiny_http = "0.12"
walkdir = "2"
zstd = "0.13"
csv = "1.3"
tempfile = "3"
