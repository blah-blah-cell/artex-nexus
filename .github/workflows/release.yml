name: Release Prebuilt Binaries (Linux, macOS, Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            goos: linux
            goarch: amd64
            ext: ""
          - os: macos-latest
            target: macos-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - os: windows-latest
            target: windows-x86_64
            goos: windows
            goarch: amd64
            ext: ".exe"

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.96.0"

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache-dependency-path: go/go.sum

      - name: Build Rust release binaries
        run: cargo build --release --locked --workspace

      - name: Build Go static binaries
        working-directory: go
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w" -o "bin/patch-diff-mcp${{ matrix.ext }}" ./cmd/patch-diff-mcp
          go build -trimpath -ldflags="-s -w" -o "bin/scope-guard-mcp${{ matrix.ext }}" ./cmd/scope-guard-mcp
          go build -trimpath -ldflags="-s -w" -o "bin/attack-surface-mcp${{ matrix.ext }}" ./cmd/attack-surface-mcp

      - name: Package release archive
        shell: bash
        run: |
          mkdir -p dist/artex-nexus-${{ matrix.target }}
          cp "target/release/nexus-sync${{ matrix.ext }}" "dist/artex-nexus-${{ matrix.target }}/"
          cp "target/release/cve-intel-mcp${{ matrix.ext }}" "dist/artex-nexus-${{ matrix.target }}/"
          cp "go/bin/patch-diff-mcp${{ matrix.ext }}" "dist/artex-nexus-${{ matrix.target }}/"
          cp "go/bin/scope-guard-mcp${{ matrix.ext }}" "dist/artex-nexus-${{ matrix.target }}/"
          cp "go/bin/attack-surface-mcp${{ matrix.ext }}" "dist/artex-nexus-${{ matrix.target }}/"
          cp LICENSE THIRD_PARTY_NOTICES.md SECURITY.md "dist/artex-nexus-${{ matrix.target }}/"
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "artex-nexus-${{ matrix.target }}.zip" "artex-nexus-${{ matrix.target }}"
          else
            tar -czf "artex-nexus-${{ matrix.target }}.tar.gz" "artex-nexus-${{ matrix.target }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish-release:
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all platform archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a62886c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release-assets/*

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refusing to overwrite an immutable tag release." >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ARTEX-Nexus ${GITHUB_REF_NAME}" \
            --generate-notes
