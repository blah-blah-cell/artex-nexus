name: Release Prebuilt Binaries (Linux, macOS, Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            goos: linux
            goarch: amd64
            ext: ""
          - os: macos-latest
            target: macos-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - os: windows-latest
            target: windows-x86_64
            goos: windows
            goarch: amd64
            ext: ".exe"

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go/go.sum

      - name: Build Rust release binaries
        run: cargo build --release --workspace

      - name: Build Go static binaries
        working-directory: go
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w" -o "bin/patch-diff-mcp${{ matrix.ext }}" ./cmd/patch-diff-mcp
          go build -trimpath -ldflags="-s -w" -o "bin/scope-guard-mcp${{ matrix.ext }}" ./cmd/scope-guard-mcp

      - name: Package release archive
        shell: bash
        run: |
          mkdir -p dist/artex-nexus-${{ matrix.target }}
          cp "target/release/nexus-sync${{ matrix.ext }}" "dist/artex-nexus-${{ matrix.target }}/"
          cp "target/release/cve-intel-mcp${{ matrix.ext }}" "dist/artex-nexus-${{ matrix.target }}/"
          cp "go/bin/patch-diff-mcp${{ matrix.ext }}" "dist/artex-nexus-${{ matrix.target }}/"
          cp "go/bin/scope-guard-mcp${{ matrix.ext }}" "dist/artex-nexus-${{ matrix.target }}/"
          cp LICENSE THIRD_PARTY_NOTICES.md SECURITY.md "dist/artex-nexus-${{ matrix.target }}/"
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "artex-nexus-${{ matrix.target }}.zip" "artex-nexus-${{ matrix.target }}"
          else
            tar -czf "artex-nexus-${{ matrix.target }}.tar.gz" "artex-nexus-${{ matrix.target }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish-release:
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "ARTEX-Nexus ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
