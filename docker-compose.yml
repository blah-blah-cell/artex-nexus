services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - artex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex}"]
      interval: 10s
      timeout: 5s
      retries: 5

  artex:
    build:
      context: ./vendor/ARTEX
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      cve-intel-mcp:
        condition: service_started
      patch-diff-mcp:
        condition: service_started
      scope-guard-mcp:
        condition: service_started
      attack-surface-mcp:
        condition: service_started
    ports:
      - "${ARTEX_PORT:-8787}:8787"
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ARTEX_SKILL_DIR: /opt/artex-nexus-skills
    volumes:
      - ./skills:/opt/artex-nexus-skills:ro
      - ./knowledge:/opt/artex-nexus-knowledge:ro

  cve-intel-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    restart: unless-stopped
    command: ["cve-intel-mcp", "--transport", "http", "--host", "0.0.0.0", "--port", "8901", "--db-path", "/data/cve_kb_med_plus.sqlite"]
    ports:
      - "127.0.0.1:8901:8901"
    volumes:
      - ./data:/data:ro

  patch-diff-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    restart: unless-stopped
    command: ["patch-diff-mcp", "--transport", "http", "--host", "0.0.0.0", "--port", "8902"]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "127.0.0.1:8902:8902"

  scope-guard-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    restart: unless-stopped
    command: ["scope-guard-mcp", "--transport", "http", "--host", "0.0.0.0", "--port", "8903", "--config-dir", "/config", "--state-dir", "/data/receipts"]
    ports:
      - "127.0.0.1:8903:8903"
    volumes:
      - ./data:/data
      - ./config:/config:ro

  attack-surface-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    restart: unless-stopped
    command: ["attack-surface-mcp", "--transport", "http", "--host", "0.0.0.0", "--port", "8904"]
    ports:
      - "127.0.0.1:8904:8904"

volumes:
  artex_pgdata:
